# Roqya Sound

پروژه‌ی وب‌اپ اسلامی مدرن با تمرکز بر دسته‌بندی صوتی، آرامش، دعا، تلاوت و تجربه کاربری مدرن.

## ویژگی‌ها
- رابط کاربری شیک و مدرن با RTL
- دسته‌بندی‌ها برای آرامش، دعا، تلاوت و دفع بدی
- کتابخانه‌ی صوتی با جستجو و فیلتر
- بخش برنامه‌های روزانه و سوالات متداول
- طراحی واکنش‌گرا برای موبایل و دسکتاپ

## اجرا
```bash
npm install
npm run dev
```

## ساخت نسخه‌ی production
```bash
npm run build
```

